name: Test

# Every pull request and every push to main: database behaviour tests and an
# Edge Function type check. Nothing is deployed here; see deploy.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Migrations + behaviour tests (PGlite)
        run: npm run test:db

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
