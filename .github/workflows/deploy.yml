name: Deploy

# Manual only: Actions › Deploy › Run workflow. There is one Supabase project
# (the live one the outlets use), so nothing deploys on merge.
#
# Repository secrets (Settings › Secrets and variables › Actions):
#   SUPABASE_ACCESS_TOKEN   supabase.com › Account › Access tokens
#   SUPABASE_PROJECT_ID     the project ref (xxxx in https://xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD    the database password set when the project was created
#
# Function secrets (Cloudflare, OneSignal) are set once with `supabase secrets set`, not here.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [database and functions, database only, functions only]
        default: database and functions
      dry_run:
        description: Dry run (show which migrations would apply, change nothing)
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings › Environments) to
    # make a second person approve every deploy.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations (dry run)
        if: inputs.target != 'functions only'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations
        if: inputs.target != 'functions only' && !inputs.dry_run
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      # verify_jwt per function comes from supabase/config.toml
      # (stream-webhook and push are called by Cloudflare and pg_net, not users).
      - name: Edge Functions
        if: inputs.target != 'database only' && !inputs.dry_run
        run: supabase functions deploy --project-ref "$PROJECT_ID" --use-api

      - name: Summary
        run: |
          {
            echo "### Deploy: ${{ inputs.target }}"
            echo "Dry run: ${{ inputs.dry_run }}"
            echo "Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
